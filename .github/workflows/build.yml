name: Build TH Finance APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq "TH_Finance_Android*.zip"

      - name: Fix code order
        run: |
          python3 - <<'PY'
          p = "TH_Finance_Android/app/src/main/java/com/thfinance/app/MainActivity.kt"
          s = open(p, encoding="utf-8").read()
          start = s.index("    val pdfLauncher = rememberLauncherForActivityResult")
          end = s.index("    var month by remember")
          block = s[start:end]
          s = s[:start] + s[end:]
          anchor = '    val fmt = remember { NumberFormat.getNumberInstance(Locale("fr", "DZ")) }\n'
          assert anchor in s
          s = s.replace(anchor, anchor + block, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: TH_Finance_Android
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TH-Finance-APK
          path: TH_Finance_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
